<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1054 1492" role="img" aria-label="Tattoo Studio">
  <!--
    Monograma do estudio, vetorizado. Substitui o logo.jpg por dois motivos.

    Escala sem perda, do menu lateral a uma tela grande, e pesa poucos kilobytes
    contra os 90 KB do raster.

    E nao tem fundo: o retangulo preto do arquivo original foi retirado para que
    a marca possa aparecer sobre qualquer superficie. Com o fundo embutido, ela
    so funcionaria sobre preto, e um bloco escuro apareceria assim que alguem a
    usasse sobre o off-white.

    A proporcao e 1054x1492, ou seja RETRATO. Quem usar precisa respeitar isso:
    caixa quadrada com object-fit cover corta o escudo em cima e embaixo, que foi
    exatamente o defeito da primeira versao da casca.

    O ouro do arquivo, #D9A514, confirma a paleta que os tokens ja registravam
    como extraida do monograma (a variavel color-gold, #d9a441).

    Atencao ao editar: comentario XML nao aceita hifen duplo. Um travessao
    escrito com dois hifens quebra o arquivo inteiro, e o navegador passa a
    servi-lo sem renderizar.
  -->
  <g fill="#D9A514" fill-rule="evenodd">
    <path d="M 559 252 L 502 253 L 502 751 L 521 743 L 540 729 L 551 714 L 559 687 Z M 538 269 L 539 687 L 534 706 L 528 718 L 523 720 L 521 289 L 522 270 Z "/>
