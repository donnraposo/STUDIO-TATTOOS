<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="">
  <!--
    Banner do estudio, para o cartao heroi e para o painel de entrada.

    E SVG e nao fotografia por tres motivos. Pesa poucos kilobytes e escala sem
    perda, de um cartao estreito no celular a uma tela larga. Nasce das formas
    do proprio monograma, entao nao depende de um banco de imagens cujo direito
    de uso teria de ser verificado. E o mais importante: e escuro e calmo no
    lado esquerdo de proposito, porque e ali que o texto branco se apoia -- uma
    foto de estudio, com pontos claros imprevisiveis, deixaria a leitura refem
    do recorte.

    O texto NAO vem embutido aqui. Ele e marcacao por cima, para poder ser
    traduzido, reescrito e reposicionado sem gerar imagem nova.
  -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="55%" stop-color="#0e0e0f" />
      <stop offset="100%" stop-color="#1a1a1c" />
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7de95" />
      <stop offset="45%" stop-color="#d9a441" />
      <stop offset="100%" stop-color="#8a5a0f" />
    </linearGradient>

    <radialGradient id="glow" cx="72%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#d9a441" stop-opacity="0.26" />
      <stop offset="55%" stop-color="#8a5a0f" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Escurece o lado esquerdo, onde o texto se apoia. -->
    <linearGradient id="readability" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.92" />
      <stop offset="42%" stop-color="#000000" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <pattern id="hatch" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#d9a441" stroke-width="1" stroke-opacity="0.13" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#base)" />
  <rect width="1600" height="900" fill="url(#hatch)" />
  <rect width="1600" height="900" fill="url(#glow)" />

  <!--
    Eco do monograma: as diagonais do escudo e as hastes verticais, reduzidas ao
    tracado. Nao e a logo repetida, e a gramatica dela -- repetir a marca inteira
    atras de um titulo competiria com ela em vez de emoldura-la.
  -->
  <g stroke="url(#gold)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g opacity="0.5" stroke-width="2.5">
      <path d="M1000 120 L1420 120 L1420 470 L1210 760 L1000 470 Z" />
      <path d="M1060 190 L1360 190 L1360 452 L1210 660 L1060 452 Z" opacity="0.7" />
    </g>

    <g opacity="0.34" stroke-width="2">
      <path d="M1120 250 L1120 520" />
      <path d="M1210 230 L1210 600" />
      <path d="M1300 250 L1300 520" />
    </g>

    <g opacity="0.22" stroke-width="1.5">
      <path d="M940 60 L1480 60" />
      <path d="M900 840 L1520 840" />
    </g>
  </g>

  <!-- Faisca alta, que da ao ouro a leitura de metal e nao de amarelo chapado. -->
  <g opacity="0.55">
    <circle cx="1210" cy="205" r="3" fill="#f7de95" />
    <circle cx="1420" cy="470" r="2.5" fill="#f7de95" />
    <circle cx="1000" cy="470" r="2.5" fill="#f7de95" />
  </g>

  <rect width="1600" height="900" fill="url(#readability)" />
</svg>
