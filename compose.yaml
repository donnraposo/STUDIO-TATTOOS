name: tattoo-studio

services:
  postgres:
    # Variante Debian, e nao alpine. A alpine quebrava neste Docker Desktop ao
    # inicializar um cluster novo: "Exec format error" carregando
    # dict_snowball.so durante o initdb, com arquitetura correta dos dois lados.
    # Mesmo PostgreSQL 17 e mesmas extensoes; muda so a libc da imagem.
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tattoo_studio}
      POSTGRES_USER: ${POSTGRES_USER:-tattoo_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tattoo_studio}
      TZ: Europe/Dublin
    # Porta publicada em 5433 para conviver com outros projetos na mesma maquina.
    # Dentro da rede do compose o banco continua em 5432, que e o que a API usa.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
    # Mesmo motivo do postgres. O proxy do Vite fala com http://api:8000 pela
    # rede interna, entao esta mudanca so afeta o acesso a partir do host --
    # /api/v1/docs passa a ser http://localhost:8001/api/v1/docs.
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      # Arquivos enviados ficam em volume nomeado, nao no sistema de arquivos da
      # imagem: recriar o container ou reconstruir a imagem nao pode perde-los.
      - object_storage:/var/lib/tattoo-studio/objects
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  object_storage:
  frontend_node_modules:
